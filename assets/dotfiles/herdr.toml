onboarding = false

[keys]
prefix = "ctrl+a"
switch_tab = "prefix+1..9"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+alt+f"
type = "popup"
command = "fzf"
description = "fuzzy find"
width = "80%"
height = "80%"

# -NoExit keeps the shell alive; without it the popup closes the moment pwsh exits.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "pwsh -NoExit"
description = "scratch shell"
width = "80%"
height = "80%"

# Single-quoted TOML literal: backslashes are not escapes. No -NoExit here, so
# the popup closes as soon as the picker is done.
[[keys.command]]
key = "prefix+f"
type = "popup"
command = 'pwsh -NoProfile -File C:\Users\kaspe\repos\config\windows\herdr-fd.ps1'
description = "jump to repo"
width = "80%"
height = "80%"

[ui]
hide_tab_bar_when_single_tab = true
prompt_new_tab_name = false
pane_borders = false
pane_gaps = false

agent_panel_sort = "spaces"
[ui.toast]
delivery = "terminal"
