onboarding = false

[keys]
prefix = "ctrl+a"
switch_tab = "prefix+1..9"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+alt+f"
type = "popup"
command = "fzf"
description = "fuzzy find"
width = "80%"
height = "80%"

# -NoExit keeps the shell alive; without it the popup closes the moment pwsh exits.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "pwsh -NoExit"
description = "scratch shell"
width = "80%"
height = "80%"

# The repo picker is ctrl+f, bound by windows\profile.ps1, and is not a popup any
# more: a popup is a separate `pwsh -NoProfile` process and cannot Set-Location
# the pane that opened it, so it had to type the cd in with send-text. Running it
# in the pane's own shell drops all of that. The cost is that ctrl+f is a
# PSReadLine handler, so it only answers at a shell prompt - not from a pane that
# is busy running something.

[ui]
hide_tab_bar_when_single_tab = true
prompt_new_tab_name = false
pane_borders = false
pane_gaps = false

agent_panel_sort = "spaces"
[ui.toast]
delivery = "terminal"
