onboarding = false

[keys]
prefix = "ctrl+a"
switch_workspace = "prefix+1..9"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+alt+f"
type = "popup"
command = "fzf"
description = "fuzzy find"
width = "80%"
height = "80%"

# -NoExit keeps the shell alive; without it the popup closes the moment pwsh exits.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "pwsh -NoExit"
description = "scratch shell"
width = "80%"
height = "80%"

[ui]
hide_tab_bar_when_single_tab = true
prompt_new_tab_name = false
pane_borders = false
pane_gaps = false

agent_panel_sort = "spaces"
[ui.toast]
delivery = "terminal"
